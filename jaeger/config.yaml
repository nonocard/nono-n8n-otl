# Jaeger v2 single-node: OTLP in -> Badger (volumen) -> Query/UI
# Todo escucha en [::] para la red privada de Railway (IPv6/dual-stack).
# Este servicio NO debe tener dominio público.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "[::]:13133"
      status:
        enabled: true
        path: "/status"

  jaeger_query:
    storage:
      traces: badger_main
    http:
      endpoint: "[::]:16686"
    grpc:
      endpoint: "[::]:16685"

  jaeger_storage:
    backends:
      badger_main:
        badger:
          directories:
            keys: "/data/badger/keys"
            values: "/data/badger/values"
          ephemeral: false
          ttl:
            spans: ${env:SPAN_TTL:-168h}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4317"
      http:
        endpoint: "[::]:4318"

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
