# Jaeger v2 single-node: OTLP in -> Badger (volumen) -> Query/UI
# + span_metrics -> :8889 (Prometheus lo scrapea) -> pestaña Monitor (SPM).
# Todo escucha en [::] para la red privada de Railway (IPv6/dual-stack).
# Este servicio NO debe tener dominio público.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter, span_metrics]
    metrics/span_metrics:
      receivers: [span_metrics]
      exporters: [prometheus]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "[::]:13133"
      status:
        enabled: true
        path: "/status"

  jaeger_query:
    storage:
      traces: badger_main
      metrics: prom_main
    http:
      endpoint: "[::]:16686"
    grpc:
      endpoint: "[::]:16685"

  jaeger_storage:
    backends:
      badger_main:
        badger:
          directories:
            keys: "/data/badger/keys"
            values: "/data/badger/values"
          ephemeral: false
          ttl:
            spans: ${env:SPAN_TTL:-720h}
    metric_backends:
      prom_main:
        prometheus:
          endpoint: ${env:PROMETHEUS_URL:-http://prometheus.railway.internal:9090}
          normalize_calls: true
          normalize_duration: true

connectors:
  # RED metrics (calls, errors, duración) por service/span.name/kind/status.
  # Cuando confirmemos el atributo de workflow que emite n8n, agregarlo en
  # dimensions para agrupar por workflow.
  span_metrics:
    metrics_flush_interval: 60s
    histogram:
      explicit:
        # Ejecuciones de n8n van de ms a minutos; los buckets default topan en 15s.
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s, 120s, 300s, 600s]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4317"
      http:
        endpoint: "[::]:4318"

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
  prometheus:
    endpoint: "[::]:8889"
